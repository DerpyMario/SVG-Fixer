name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # attach the exe to releases on tags
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke test
        shell: bash
        run: |
          cp -r tests/data smoke
          ./build/Release/SVG-Fixer.exe --no-pause smoke/sample.7z || test $? -eq 1
          test -f smoke/sample_fixed/capture.svg
          test -f smoke/sample_fixed/SVG-Fixer-Report.html
      - uses: actions/upload-artifact@v4
        with:
          name: SVG-Fixer-windows-x64
          path: build/Release/SVG-Fixer.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/SVG-Fixer.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
